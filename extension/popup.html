<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>TFT Replay Bridge</title>
  <link rel="stylesheet" href="popup.css" />
  <main>
    <h1>TFT Replay Bridge</h1>
    <p id="status" role="status">正在读取本地记录…</p>
    <p id="error" role="alert"></p>
    <button id="open" disabled>打开多场分析</button
    ><button id="download" disabled>导出全部记录</button>
    <button id="clear" disabled>清除本地记录</button>
    <p>
      打开 AlphaSim
      时自动在后台打开分析页；点击“开始”后自动保存并更新每场结果。首次安装或升级后请刷新
      AlphaSim。
    </p>
    <p>
      只保存在当前浏览器；最多保留 100 场，达到容量上限会提示导出。不读取 Cookie
      或请求头，不上传日志。
    </p>
    <a
      href="https://tftalphasim.com/simulator.html?locale=en"
      target="_blank"
      rel="noreferrer"
      >打开 AlphaSim</a
    >
  </main>
  <script src="viewer/src/capture-codec.js"></script>
  <script src="viewer/src/session.js"></script>
  <script src="popup.js"></script>
</html>
